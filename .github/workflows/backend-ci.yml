name: backend-ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-ci:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_USER: ci
          POSTGRES_DB: fashionstore_ci
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['127.0.0.1:55435:5432']
        options: >-
          --health-cmd "pg_isready -U ci -d fashionstore_ci"
          --health-interval 5s --health-timeout 3s --health-retries 12
    env:
      APP_ENV: test
      DATABASE_URL: postgresql://ci@127.0.0.1:55435/fashionstore_ci
      RATE_LIMIT_ENABLED: 'false'
      SMTP_HOST: ''
      AI_API_KEY: ''
      STRIPE_SECRET_KEY: ''
      EMAIL_BACKGROUND: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Pruebas independientes sin servicios externos
        run: python -m pytest -q --ignore=tests/integration/database/test_connection.py
      - name: Una cabeza y esquema migrado en PostgreSQL
        run: |
          python - <<'PY'
          from alembic.config import Config
          from alembic.script import ScriptDirectory
          heads = ScriptDirectory.from_config(Config('alembic.ini')).get_heads()
          if len(heads) != 1:
              raise SystemExit('La cadena Alembic debe tener exactamente una cabeza.')
          PY
          python -m alembic upgrade head
          python -m alembic check
      - name: Conexión y concurrencia reales en PostgreSQL aislado
        env:
          TEST_DATABASE_URL: postgresql://ci@127.0.0.1:55435/fashionstore_ci
          TEST_PG_URL: postgresql://ci@127.0.0.1:55435/fashionstore_ci
        run: >-
          python -m pytest -q tests/integration/database/test_connection.py
          tests/integration/database/test_sync_concurrencia_pg.py
          tests/integration/database/test_metadata_alembic.py
          tests/integration/database/test_cadena_completa.py
          tests/integration/test_rls_piloto.py
          --junitxml=postgresql-results.xml
      - name: Identificar fallos del ensayo PostgreSQL
        if: failure()
        run: |
          python - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree
          report = Path('postgresql-results.xml')
          if report.is_file():
              for case in ElementTree.parse(report).iter('testcase'):
                  for kind in ('failure', 'error'):
                      error = case.find(kind)
                      if error is None:
                          continue
                      message = error.get('message', kind)[:3000]
                      message = message.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
                      title = case.get('name', 'PostgreSQL')
                      print(f'::error title={title}::{message}')
          PY
