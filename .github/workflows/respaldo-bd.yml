name: Respaldo BD

on:
  schedule:
    - cron: '17 7 * * *' # 03:17 Bolivia
  workflow_dispatch:
    inputs:
      tipo:
        description: Tipo de copia autorizada
        type: choice
        options: [manual, pre_migration]
        default: manual

concurrency:
  group: respaldo-bd
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  version:
    # Un push no activa respaldos de producción sin la puesta en marcha acordada.
    if: ${{ github.event_name == 'workflow_dispatch' || vars.BACKUP_SCHEDULE_ENABLED == 'true' }}
    runs-on: ubuntu-24.04
    container: postgres:17-bookworm
    timeout-minutes: 8
    outputs:
      major: ${{ steps.detect.outputs.major }}
    steps:
      - run: apt-get update -qq && apt-get install -y --no-install-recommends python3
      - name: Identificar versión por el pooler de sesión
        id: detect
        env:
          BACKUP_DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
        run: |
          python3 - <<'PY'
          import os, subprocess
          from urllib.parse import unquote, urlsplit
          try:
              url = urlsplit(os.environ['BACKUP_DATABASE_URL'])
              if (url.scheme not in ('postgresql', 'postgres') or not url.hostname
                  or not url.username or not url.password or url.port not in (None, 5432)
                  or not url.path.strip('/') or url.fragment):
                  raise ValueError
              env = {k: v for k, v in os.environ.items() if k in ('PATH', 'HOME', 'LANG', 'LC_ALL')}
              env.update(PGHOST=url.hostname, PGPORT='5432', PGDATABASE=unquote(url.path[1:]),
                         PGUSER=unquote(url.username), PGPASSWORD=unquote(url.password),
                         PGSSLMODE='require', PGCONNECT_TIMEOUT='10')
              result = subprocess.run(['psql', '-XAtw', '-v', 'ON_ERROR_STOP=1', '-c', 'SHOW server_version_num'],
                                      env=env, capture_output=True, text=True, check=True, timeout=30)
              major = int(result.stdout.strip()) // 10000
              if not 14 <= major <= 18:
                  raise ValueError
          except (ValueError, KeyError, OSError, subprocess.SubprocessError):
              raise SystemExit('No se pudo identificar una versión PostgreSQL soportada por el pooler de sesión.') from None
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              print(f'major={major}', file=output)
          PY

  dump:
    needs: version
    runs-on: ubuntu-24.04
    container: postgres:${{ needs.version.outputs.major }}-bookworm
    timeout-minutes: 30
    outputs:
      artifact: ${{ steps.plan.outputs.artifact }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Preparar cliente y cifrado
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends python3-venv age
          python3 -m venv "$RUNNER_TEMP/backup-venv"
          grep -Ei '^(sqlalchemy|psycopg2-binary|alembic|tzdata)([=<>!~]|$)' requirements.txt > "$RUNNER_TEMP/backup-deps.txt"
          "$RUNNER_TEMP/backup-venv/bin/pip" install -r "$RUNNER_TEMP/backup-deps.txt"
      - id: plan
        env:
          REQUESTED_KIND: ${{ inputs.tipo }}
        run: |
          kind=daily
          retention=8
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            case "$REQUESTED_KIND" in manual|pre_migration) kind="$REQUESTED_KIND" ;; *) exit 1 ;; esac
          elif [ "$(TZ=America/La_Paz date +%u)" = 7 ]; then
            kind=weekly
            retention=90
          fi
          echo "kind=$kind" >> "$GITHUB_OUTPUT"
          echo "retention=$retention" >> "$GITHUB_OUTPUT"
          echo "artifact=bd-$(TZ=America/La_Paz date +%F)-$kind-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
      - name: Crear copia cifrada y manifiesto
        env:
          BACKUP_DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
          AGE_PUBLIC_KEY: ${{ vars.AGE_PUBLIC_KEY }}
          BACKUP_KIND: ${{ steps.plan.outputs.kind }}
        run: |
          [ -n "$AGE_PUBLIC_KEY" ] || { echo 'Falta AGE_PUBLIC_KEY.' >&2; exit 1; }
          "$RUNNER_TEMP/backup-venv/bin/python" - "$RUNNER_TEMP/bd-cifrada" <<'PY'
          import os, sys
          from scripts.respaldo.respaldar import ErrorRespaldo, conexion_pg, main
          try:
              url, _ = conexion_pg(os.environ['BACKUP_DATABASE_URL'])
              sslmode = url.query.get('sslmode', 'require')
              if (url.port or 5432) != 5432 or sslmode not in ('require', 'verify-ca', 'verify-full'):
                  raise ValueError
              os.environ['BACKUP_DATABASE_URL'] = url.update_query_dict({'sslmode': sslmode}).render_as_string(hide_password=False)
          except (ErrorRespaldo, KeyError, ValueError):
              raise SystemExit('La copia requiere el pooler de sesión y TLS.') from None
          raise SystemExit(main(['--salida', sys.argv[1], '--tipo', os.environ['BACKUP_KIND'],
                                 '--age-recipient', os.environ['AGE_PUBLIC_KEY']]))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.plan.outputs.artifact }}
          path: |
            ${{ runner.temp }}/bd-cifrada/*.dump.age
            ${{ runner.temp }}/bd-cifrada/*.manifest.json
          retention-days: ${{ steps.plan.outputs.retention }}
          if-no-files-found: error
          compression-level: 0

  verify:
    needs: [version, dump]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:${{ needs.version.outputs.major }}-bookworm
        env:
          POSTGRES_USER: verificar
          POSTGRES_DB: ensayo
          POSTGRES_HOST_AUTH_METHOD: trust # Únicamente el contenedor descartable del runner.
        ports: ['127.0.0.1:55435:5432']
        options: >-
          --health-cmd "pg_isready -U verificar -d ensayo"
          --health-interval 5s --health-timeout 3s --health-retries 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar cliente PostgreSQL y dependencias
        env:
          PG_MAJOR: ${{ needs.version.outputs.major }}
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSLo /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo 'deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt noble-pgdg main' | sudo tee /etc/apt/sources.list.d/ps-pgdg.list > /dev/null
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends age "postgresql-client-$PG_MAJOR"
          echo "/usr/lib/postgresql/$PG_MAJOR/bin" >> "$GITHUB_PATH"
          python -m pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.dump.outputs.artifact }}
          path: ${{ runner.temp }}/bd-cifrada
      - name: Validar huella, descifrar y restaurar en la base vacía
        env:
          AGE_PRIVATE_KEY: ${{ secrets.AGE_PRIVATE_KEY }}
          VERIFY_DATABASE_URL: postgresql://verificar@127.0.0.1:55435/ensayo
          APP_ENV: test
        run: |
          umask 077
          work=$(mktemp -d "$RUNNER_TEMP/verify-private.XXXXXXXX")
          trap 'rm -f -- "$work/key" "$work/ensayo.dump"; rmdir -- "$work"' EXIT
          [ -n "$AGE_PRIVATE_KEY" ] || { echo 'Falta AGE_PRIVATE_KEY.' >&2; exit 1; }
          printf '%s\n' "$AGE_PRIVATE_KEY" > "$work/key"
          unset AGE_PRIVATE_KEY
          export VERIFY_PRIVATE_DIR="$work"
          python - <<'PY'
          import hashlib, json, os, re, subprocess
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP'])
          folder = root / 'bd-cifrada'
          manifest, = folder.glob('*.manifest.json')
          meta = json.loads(manifest.read_text(encoding='utf-8'))
          name = meta['archivo']
          if not re.fullmatch(r'[A-Za-z0-9_.-]+\.dump\.age', name):
              raise SystemExit('Nombre de copia inválido.')
          cipher = folder / name
          with cipher.open('rb') as file:
              digest = hashlib.file_digest(file, 'sha256').hexdigest()
          if digest != meta['sha256'] or cipher.stat().st_size != meta['bytes']:
              raise SystemExit('La copia cifrada no coincide con su manifiesto.')
          private = Path(os.environ['VERIFY_PRIVATE_DIR'])
          result = subprocess.run(['age', '-d', '-i', str(private/'key'), '-o', str(private/'ensayo.dump'), str(cipher)],
                                  stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL, check=False)
          if result.returncode:
              raise SystemExit('No se pudo descifrar la copia.')
          (private/'key').unlink()
          args = ['python', '-m', 'scripts.respaldo.verificar_restauracion', '--archivo', str(private/'ensayo.dump'),
                  '--destino-env', 'VERIFY_DATABASE_URL', '--reporte', str(root/'verificacion.json')]
          if meta['tipo'] == 'pre_migration':
              args.extend(['--revision-esperada', meta['revision_alembic']])
          raise SystemExit(subprocess.run(args, check=False).returncode)
          PY
      - uses: actions/upload-artifact@v4
        if: ${{ always() && !cancelled() }}
        with:
          name: verificacion-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/verificacion.json
          retention-days: 8
          if-no-files-found: warn

  report:
    needs: [version, dump, verify]
    if: ${{ always() && needs.version.result != 'skipped' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
      - uses: actions/download-artifact@v4
        if: ${{ needs.dump.result == 'success' }}
        with:
          name: ${{ needs.dump.outputs.artifact }}
          path: ${{ runner.temp }}/bd-cifrada
      - uses: actions/download-artifact@v4
        if: ${{ always() && needs.verify.result != 'skipped' }}
        continue-on-error: true
        with:
          name: verificacion-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/reporte
      - name: Registrar el resultado en Operación
        if: ${{ always() }}
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
          BACKUP_REPORT_TOKEN: ${{ secrets.BACKUP_REPORT_TOKEN }}
          VERIFY_RESULT: ${{ needs.verify.result }}
          BACKUP_ARTIFACT: ${{ needs.dump.outputs.artifact }}
          REQUESTED_KIND: ${{ inputs.tipo }}
        run: |
          python3 - <<'PY'
          import http.client, json, os
          from datetime import datetime, timezone
          from pathlib import Path
          from urllib.parse import urlsplit
          from zoneinfo import ZoneInfo
          root = Path(os.environ['RUNNER_TEMP'])
          manifests = list((root/'bd-cifrada').glob('*.manifest.json'))
          meta = json.loads(manifests[0].read_text(encoding='utf-8')) if len(manifests) == 1 else {}
          report_file = root/'reporte'/'verificacion.json'
          report = json.loads(report_file.read_text(encoding='utf-8')) if report_file.is_file() else None
          ok = bool(meta and report and report.get('ok') is True and os.environ['VERIFY_RESULT'] == 'success')
          if report and report.get('ok') is True and not ok:
              report = None  # La API exige que verify_report.ok concuerde con verify_status.
          now = datetime.now(timezone.utc).isoformat()
          artifact = os.environ['BACKUP_ARTIFACT']
          inferred_kind = 'weekly' if datetime.now(ZoneInfo('America/La_Paz')).isoweekday() == 7 else 'daily'
          payload = {
              'kind': meta.get('tipo') or os.environ.get('REQUESTED_KIND') or inferred_kind,
              'started_at': meta.get('inicio', now), 'finished_at': meta.get('fin', now),
              'size_bytes': meta.get('bytes', 0), 'sha256': meta.get('sha256'),
              'storage_ref': f'artifact:{artifact}' if meta and artifact else None,
              'alembic_revision': meta.get('revision_alembic'), 'pg_server_version': meta.get('version_servidor'),
              'verify_status': 'ok' if ok else 'failed', 'verify_report': report,
              'workflow_run_url': (f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}"
                                   f"/actions/runs/{os.environ['GITHUB_RUN_ID']}/attempts/{os.environ['GITHUB_RUN_ATTEMPT']}"),
          }
          url = urlsplit(os.environ['API_BASE_URL'])
          token = os.environ['BACKUP_REPORT_TOKEN']
          if (url.scheme != 'https' or not url.hostname or url.username or url.password
              or url.query or url.fragment or not token):
              raise SystemExit('Falta configurar API_BASE_URL HTTPS o BACKUP_REPORT_TOKEN.')
          conn = http.client.HTTPSConnection(url.hostname, url.port or 443, timeout=25)
          try:
              conn.request('POST', url.path.rstrip('/')+'/platform/ops/backups', json.dumps(payload),
                           {'Authorization': 'Bearer '+token, 'Content-Type': 'application/json'})
              status = conn.getresponse().status
          except (OSError, http.client.HTTPException):
              raise SystemExit('No se pudo reportar a la API.') from None
          finally:
              conn.close()
          if not 200 <= status < 300:
              raise SystemExit(f'La API rechazó el reporte (HTTP {status}).')
          print('Resultado registrado sin incluir secretos.')
          PY
      - name: Avisar fallo mediante un issue sin datos sensibles
        if: ${{ always() && (failure() || needs.version.result != 'success' || needs.dump.result != 'success' || needs.verify.result != 'success') }}
        uses: actions/github-script@v7
        with:
          script: |
            const date = new Date().toISOString().slice(0, 10);
            await github.rest.issues.create({
              ...context.repo,
              title: `Respaldo fallido ${date}`,
              body: `No se completó la copia, la restauración de prueba o el reporte. Revisar la ejecución #${context.runId}.`,
            });
